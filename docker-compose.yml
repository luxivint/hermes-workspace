services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      HERMES_UID: "10010"

      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"

      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:-}

    volumes:
      - hermes-agent-data:/opt/data

    expose:
      - "8642"
      - "9119"

    networks:
      - dokploy-network

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    restart: unless-stopped
    depends_on:
      - hermes-agent

    environment:
      HOST: "0.0.0.0"
      PORT: "3000"

      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace

      HERMES_API_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_URL: http://hermes-agent:9119

      HERMES_API_TOKEN: ${API_SERVER_KEY:-}
      CLAUDE_API_TOKEN: ${API_SERVER_KEY:-}
      CLAUDE_DASHBOARD_TOKEN: ${API_SERVER_KEY:-}

      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

    volumes:
      - hermes-agent-data:/home/workspace/.hermes
      - hermes-workspace-files:/workspace

    expose:
      - "3000"

    networks:
      - dokploy-network

volumes:
  hermes-agent-data:
  hermes-workspace-files:

networks:
  dokploy-network:
    external: true
